<aside class="sidebar">

    <style>
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 260px;
            padding: 22px 16px;
            background:
                linear-gradient(180deg,
                    rgba(7, 25, 16, .98),
                    rgba(3, 14, 9, .98));
            border-right: 1px solid rgba(53, 245, 139, .12);
            z-index: 100;
            overflow-y: auto;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 10px 25px;
        }

        .brand-logo {
            width: 45px;
            height: 45px;
            display: grid;
            place-items: center;
            border-radius: 14px;
            background: linear-gradient(135deg,
                    #51ff99,
                    #11a95a);
            color: #031008;
            font-size: 24px;
            box-shadow:
                0 0 30px rgba(53, 245, 139, .18);
        }

        .brand-name {
            font-family: "Space Grotesk", sans-serif;
            font-size: 22px;
            font-weight: 700;
        }

        .brand-name span {
            color: #42f68d;
        }

        .brand-sub {
            color: #637d70;
            font-size: 10px;
            margin-top: 2px;
        }

        .nav-label {
            color: #526b5e;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1.7px;
            text-transform: uppercase;
            padding: 14px 12px 9px;
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            margin: 4px 0;
            border-radius: 13px;
            color: #91a99d;
            font-size: 13px;
            font-weight: 700;
            border: 1px solid transparent;
            transition: .2s ease;
        }

        .nav-link:hover {
            color: #ecfff3;
            background: rgba(53, 245, 139, .06);
            border-color: rgba(53, 245, 139, .08);
        }

        .nav-link.active {
            color: #63ffa2;
            background:
                linear-gradient(90deg,
                    rgba(53, 245, 139, .13),
                    rgba(53, 245, 139, .03));
            border-color: rgba(53, 245, 139, .14);
            box-shadow: inset 3px 0 #35f58b;
        }

        .nav-icon {
            width: 28px;
            text-align: center;
            font-size: 18px;
        }

        .system-card {
            margin: 25px 4px 0;
            padding: 16px;
            border-radius: 17px;
            background: rgba(53, 245, 139, .05);
            border: 1px solid rgba(53, 245, 139, .1);
        }

        .system-dot {
            width: 8px;
            height: 8px;
            display: inline-block;
            border-radius: 50%;
            background: #35f58b;
            box-shadow: 0 0 12px #35f58b;
            margin-right: 7px;
        }

        .system-title {
            font-size: 11px;
            font-weight: 800;
            color: #d8f9e4;
        }

        .system-text {
            margin-top: 7px;
            color: #617c6d;
            font-size: 10px;
            line-height: 1.5;
        }
