<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}EcoNex{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #06110d;
            --bg2: #091a13;
            --panel: rgba(13, 35, 25, 0.78);
            --panel2: rgba(17, 49, 34, 0.72);
            --border: rgba(87, 255, 161, 0.14);
            --green: #35f58b;
            --green2: #18c96b;
            --text: #f2fff7;
            --muted: #91aa9d;
            --danger: #ff6b6b;
            --warning: #ffd166;
        }

        body {
            font-family: "Inter", sans-serif;
            background:
                radial-gradient(circle at 80% 0%, rgba(34, 197, 94, 0.12), transparent 30%),
                radial-gradient(circle at 10% 90%, rgba(16, 185, 129, 0.08), transparent 30%),
                var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button,
        input,
        select {
            font-family: inherit;
        }

        .app {
            display: flex;
            min-height: 100vh;
        }

        .main {
            flex: 1;
            margin-left: 260px;
            padding: 34px;
            min-width: 0;
        }

        .page {
            max-width: 1450px;
            margin: auto;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .eyebrow {
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1,
        h2,
        h3 {
            font-family: "Space Grotesk", sans-serif;
        }

        .hero {
            position: relative;
            overflow: hidden;
            border: 1px solid var(--border);
            background:
                linear-gradient(135deg,
                    rgba(27, 88, 54, 0.35),
                    rgba(8, 25, 17, 0.88));
            border-radius: 28px;
            padding: 42px;
            margin-bottom: 24px;
            box-shadow:
                0 25px 80px rgba(0, 0, 0, 0.25),
                inset 0 1px rgba(255, 255, 255, 0.04);
        }

        .hero::after {
            content: "";
            position: absolute;
            width: 300px;
            height: 300px;
            right: -100px;
            top: -120px;
            background: rgba(53, 245, 139, 0.12);
            border-radius: 50%;
            filter: blur(60px);
        }

        .hero h1 {
            font-size: clamp(34px, 5vw, 66px);
            line-height: 1;
            max-width: 850px;
            margin: 12px 0 18px;
        }

        .hero p {
            color: var(--muted);
            max-width: 760px;
            line-height: 1.8;
            font-size: 16px;
        }

        .green {
            color: var(--green);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: 999px;
            border: 1px solid rgba(53, 245, 139, .22);
            background: rgba(53, 245, 139, .08);
            color: var(--green);
            font-size: 12px;
            font-weight: 800;
        }

        .grid {
            display: grid;
            gap: 18px;
        }

        .grid-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .grid-3 {
            grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .grid-4 {
            grid-template-columns: repeat(4, minmax(0, 1fr));
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 24px;
            backdrop-filter: blur(18px);
            box-shadow: 0 18px 50px rgba(0, 0, 0, .18);
        }

        .panel:hover {
            border-color: rgba(53, 245, 139, .28);
            transform: translateY(-2px);
            transition: .2s ease;
        }

        .metric {
            min-height: 145px;
        }

        .metric-icon {
            font-size: 27px;
            margin-bottom: 18px;
        }

        .metric-value {
            font-family: "Space Grotesk", sans-serif;
            font-size: 34px;
            font-weight: 700;
            margin: 7px 0;
        }

        .metric-label {
            color: var(--muted);
            font-size: 13px;
        }

        .section-title {
            font-size: 24px;
            margin-bottom: 7px;
        }

        .section-subtitle {
            color: var(--muted);
            line-height: 1.7;
            margin-bottom: 20px;
        }

        .btn {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            border: 0;
            border-radius: 13px;
            padding: 13px 18px;
            font-weight: 800;
            cursor: pointer;
            transition: .2s ease;
        }

        .btn-primary {
            color: #041008;
            background: linear-gradient(135deg, #54ff9b, #17c96a);
            box-shadow: 0 10px 30px rgba(53, 245, 139, .18);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 40px rgba(53, 245, 139, .28);
        }

        .btn-secondary {
            color: var(--text);
            background: rgba(255, 255, 255, .05);
            border: 1px solid var(--border);
        }

        .btn-secondary:hover {
            border-color: rgba(53, 245, 139, .35);
            background: rgba(53, 245, 139, .07);
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            color: #d9eee1;
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        input,
        select {
            width: 100%;
            background: rgba(3, 15, 9, .8);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 13px;
            padding: 14px 15px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: rgba(53, 245, 139, .6);
            box-shadow: 0 0 0 3px rgba(53, 245, 139, .07);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .status {
            display: inline-flex;
            padding: 7px 11px;
            border-radius: 999px;
            font-size: 11px;
            font-weight: 800;
        }

        .status-safe {
            color: var(--green);
            background: rgba(53, 245, 139, .09);
            border: 1px solid rgba(53, 245, 139, .2);
        }

        .status-warning {
            color: var(--warning);
            background: rgba(255, 209, 102, .08);
            border: 1px solid rgba(255, 209, 102, .18);
        }

        .status-danger {
            color: var(--danger);
            background: rgba(255, 107, 107, .08);
            border: 1px solid rgba(255, 107, 107, .18);
        }

        .status-neutral {
            color: #b7c8be;
            background: rgba(255, 255, 255, .05);
        }

        .notice {
            padding: 17px;
            border-radius: 15px;
            margin-top: 18px;
            line-height: 1.6;
        }

        .notice-info {
            background: rgba(53, 245, 139, .07);
            border: 1px solid rgba(53, 245, 139, .14);
            color: #ccebd8;
        }

        .notice-danger {
            background: rgba(255, 107, 107, .07);
            border: 1px solid rgba(255, 107, 107, .18);
            color: #ffc3c3;
        }

        .notice-warning {
            background: rgba(255, 209, 102, .07);
            border: 1px solid rgba(255, 209, 102, .18);
            color: #ffe7a2;
        }

        .meal-row {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 14px 0;
            border-bottom: 1px solid rgba(255, 255, 255, .06);
        }

        .meal-row:last-child {
            border-bottom: 0;
        }

        .meal-icon {
            width: 44px;
            height: 44px;
            display: grid;
            place-items: center;
            border-radius: 13px;
            background: rgba(53, 245, 139, .08);
            font-size: 21px;
        }

        .meal-info {
            flex: 1;
        }

        .meal-info strong {
            display: block;
            margin-bottom: 4px;
        }

        .meal-info span {
            color: var(--muted);
            font-size: 12px;
        }

        .number {
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--green);
        }

        .menu-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
        }

        .food-chip {
            padding: 9px 12px;
            background: rgba(255, 255, 255, .04);
            border: 1px solid rgba(255, 255, 255, .07);
            border-radius: 999px;
            font-size: 12px;
            color: #d8e9df;
        }

        .food-chip::first-letter {
            color: var(--green);
        }

        .progress {
            height: 9px;
            background: rgba(255, 255, 255, .06);
            border-radius: 999px;
            overflow: hidden;
            margin-top: 12px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #19c96c, #5cff9d);
            border-radius: inherit;
        }

        .route {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
        }

        .route-box {
            padding: 20px;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 17px;
            background: rgba(255, 255, 255, .03);
        }

        .route-arrow {
            color: var(--green);
            font-size: 25px;
        }

        .footer-note {
            margin-top: 28px;
            color: #607a6d;
            text-align: center;
            font-size: 12px;
        }

        @media (max-width: 1000px) {

            .main {
                margin-left: 0;
                padding: 20px;
            }

            .grid-4 {
                grid-template-columns: repeat(2, 1fr);
            }

            .grid-3 {
                grid-template-columns: 1fr;
            }

            .sidebar {
                display: none;
            }
        }

        @media (max-width: 650px) {

            .hero {
                padding: 28px;
            }

            .hero h1 {
                font-size: 38px;
            }

            .grid-2,
            .grid-4,
            .form-grid {
                grid-template-columns: 1fr;
            }

            .route {
                grid-template-columns: 1fr;
            }

            .route-arrow {
                transform: rotate(90deg);
                text-align: center;
            }
        }
    </style>

    {% block head %}{% endblock %}

</head>

<body>

    <div class="app">

        {% include "sidebar.html" %}

        <main class="main">

            <div class="page">

                {% block content %}{% endblock %}

                <div class="footer-note">
                    EcoNex AI • Food Rescue • Sustainability • Team EcoNex
                </div>

            </div>

        </main>

    </div>

    {% block scripts %}{% endblock %}

</body>

</html>
